services:
  db:
    image: postgres:16-alpine
    container_name: english-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: english_app
    ports:
      - "5432:5432"
    volumes:
      - english-app-db:/var/lib/postgresql/data

volumes:
  english-app-db:
